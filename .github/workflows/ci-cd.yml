name: CI/CD TV Hub

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Test (npm test)
        run: npm test

      - name: Build (npm run build)
        run: npm run build --if-present

  deploy:
    name: Deploy a Render
    # deploy depende de test-build (needs): si una prueba o el build fallan, este job
    # no se ejecuta y Render conserva la última versión buena. Solo despliega en push a master,
    # nunca en pull requests.
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook de Render
        # La URL del hook vive solo en GitHub Secrets; Actions la enmascara en los logs.
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
